<div class="container mt-5">
  <h3 class="text-center mb-4">Recuperar Contraseña</h3>

  <form [formGroup]="form" (ngSubmit)="recuperar()" *ngIf="!enviado">
    <div class="mb-3">
      <label for="username" class="form-label">Nombre de Usuario</label>
      <input type="text" class="form-control" formControlName="username" />
      <div
        *ngIf="submitted && form.get('username')?.invalid"
        class="text-danger"
      >
        El nombre de usuario es requerido
      </div>
    </div>
<div class="row">   
   <div class="col-md-3">
      <button
        type="button"
        class="btn btn-danger w-100"
        (click)="onCancel()"
      >
        Cancelar
      </button>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </div>
  </div>
  </form>

  <div *ngIf="enviado">
    <div class="alert alert-info text-center">
      Si el usuario existe, se ha enviado un correo para restablecer la
      contraseña.
    </div>
    <div class="text-center">
      <button routerLink="/login" class="btn btn-primary">
        Volver al login
      </button>
    </div>
  </div>
</div>
