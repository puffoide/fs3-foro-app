<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <h3 class="text-center">Iniciar sesión</h3>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" formControlName="username" id="username">
            <div *ngIf="submitted && loginForm.get('username')?.invalid" class="text-danger">
              El nombre de usuario es obligatorio.
            </div>
          </div>
  
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password" id="password">
            <div *ngIf="submitted && loginForm.get('password')?.invalid" class="text-danger">
              La contraseña es obligatoria.
            </div>
          </div>
  
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          <div *ngIf="loginError" class="mt-2 alert alert-danger text-center">
            {{ loginError }}
          </div>
        </form>
      </div>
    </div>
  </div>
